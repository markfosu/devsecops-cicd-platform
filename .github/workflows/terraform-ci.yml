
name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validate:
    name: Terraform Format and Validate
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: terraform/ecr
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: terraform/ecr
        run: terraform validate

      - name: Set up Python for Checkov
        run: |
          python3 -m venv .venv-checkov
          .venv-checkov/bin/python -m pip install --upgrade pip
          .venv-checkov/bin/python -m pip install checkov==3.4.3

      - name: Run Checkov security scan
        run: .venv-checkov/bin/checkov -d . --framework terraform
